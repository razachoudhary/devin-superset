name: Devin Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: devin-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest pytest-mock marshmallow "sqlglot>=30.12,<31"

      - name: Run scoped unit tests
        run: |
          pytest tests/unit_tests/schemas/ -q --no-header
