name: Devin Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: devin-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e . pytest pytest-mock

      - name: Run scoped unit tests
        run: |
          pytest tests/unit_tests/schemas/ -q --no-header
