name: Devin Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: devin-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
      SUPERSET_TESTENV: true
      SUPERSET_SECRET_KEY: not-a-secret
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python and install Superset with test dependencies
        uses: ./.github/actions/setup-backend/
        with:
          python-version: "3.11"
          requirements-type: dev

      - name: Run unit tests
        run: pytest tests/unit_tests -q --no-header
